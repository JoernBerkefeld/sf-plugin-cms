openapi: 3.0.3
info:
  title: CMS Connect REST API
  version: v67.0
  description: |-
    > **Note**: The API Reference has a new three-panel layout. Browse grouped endpoints on the left, review endpoint details in the center, and access examples on the right.

    **Important**: Where possible, we changed noninclusive terms to align with our company value of Equality. We maintained certain terms to avoid any effect on customer implementations.
  x-metadata:
    lastUpdated: '2026-07-21'
    documentationUrl: https://developer.salesforce.com/docs/platform/connect-rest-api/references/connect-rest-api-cms
servers:
- url: https://{MyDomainName}.my.salesforce.com/services/data/v67.0
  description: API server for your Salesforce org.
  variables:
    MyDomainName:
      description: |
        Your org's My Domain name, which is used as a subdomain for the URLs that Salesforce uses to serve your org.

        For example, if your Lightning URL is `https://yourcompanyname.lightning.force.com`, then your My Domain name is `yourcompanyname`.

        Find your My Domain name and login URL on the My Domain page in Setup, or use the `getMyDomainName()` method in the Apex Domain class.
      default: None
paths:
  /connect/cms/channels:
    description: The management resource endpoint of Managed Content Channels API. Used to create and get all ManagedContentChannel
    parameters: []
    get:
      operationId: getManagedContentChannels
      summary: CMS Channels
      description: |
        Get managed content channels.

        To get managed content delivery channels, see [CMS Delivery Channels](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/CMS-Managed-Content-Resources/operation/getManagedContentDeliveryChannels).

        _Available in: v62.0_
      parameters:
      - name: page
        in: query
        description: |
          Number of the page you want returned. Starts at 0. If you
          don’t specify a value or if you specify 0, the first page is returned.

          _Available in: v62.0_
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        description: |
          Specifies the number of items
          per page. Valid values are from 1 through 250. If you don’t specify a value,
          the default size is 25.

          _Available in: v62.0_
        required: false
        schema:
          type: integer
      - name: showDetails
        in: query
        description: |
          Specifies whether to show the channels’ detailed information ( `true` ) or summary information only ( `false` ). If you don't specify a value, the default is `false` .

          _Available in: v62.0_
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Collection of managed content channels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentChannels'
          x-summary: Managed Content Channels
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channels
    post:
      operationId: postManagedContentChannels
      summary: CMS Channels
      description: |
        Create managed content channels.

        To get managed content delivery channels, see [CMS Delivery Channels](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/CMS-Managed-Content-Resources/operation/getManagedContentDeliveryChannels).

        _Available in: v62.0_
      parameters: []
      requestBody:
        description: Input body to create a managed content channel.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentChannelCreate'
            examples:
              example_1:
                value:
                  name: New Channel
                  targetId: 0DBxx0000004ExEGAU
                  type: Community
                summary: Payload 1
      responses:
        '200':
          description: Managed content channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentChannel'
          x-summary: Managed Content Channel
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channels
  /connect/cms/channels/{channelId}:
    description: The management resource endpoint of CMS Channels for a specific ManagedContentChannel (CMS Channel)
    parameters:
    - name: channelId
      in: path
      description: ID of a channel.
      required: true
      schema:
        type: string
        format: Id
        pattern: ^(0ap)\w*
    get:
      operationId: getManagedContentChannel
      summary: CMS Channel
      description: |
        Get a managed content channel.

        To get a managed content delivery channel, see [CMS Delivery Channel](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/Enhanced-CMS-Workspaces-Resources/operation/getManagedContentDeliveryChannel).

        _Available in: v62.0_
      responses:
        '200':
          description: Managed content channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentChannel'
          x-summary: Managed Content Channel
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channel
    patch:
      operationId: patchManagedContentChannel
      summary: CMS Channel
      description: |
        Update a managed content channel.

        To get a managed content delivery channel, see [CMS Delivery Channel](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/Enhanced-CMS-Workspaces-Resources/operation/getManagedContentDeliveryChannel).

        _Available in: v62.0_
      requestBody:
        description: Input body to update a managed content channel.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentChannelUpdate'
            examples:
              example_1:
                value:
                  name: New Channel Name
                summary: Payload 1
      responses:
        '200':
          description: Managed content channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentChannel'
          x-summary: Managed Content Channel
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channel
    delete:
      operationId: deleteManagedContentChannel
      summary: CMS Channel
      description: |
        Delete a managed content channel.

        To get a managed content delivery channel, see [CMS Delivery Channel](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/Enhanced-CMS-Workspaces-Resources/operation/getManagedContentDeliveryChannel).

        _Available in: v62.0_
      responses:
        '200':
          description: "The response header contains an HTTP status code. If the response isn’t successful, the\n\t\tresponse body contains an error message, and if appropriate, information about the field or\n\t\tobject where the error occurred.\n"
          x-summary: Status Codes and Error Responses
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channel
  /connect/cms/channels/{channelId}/search/indexes:
    description: Used to trigger search indexes for CMS content
    parameters:
    - name: channelId
      in: path
      description: ID of a channel.
      required: true
      schema:
        type: string
        format: Id
        pattern: ^(0ap)\w*
    get:
      operationId: getManagedContentSearchIndexCollection
      summary: CMS Channel Search Indexes
      description: |
        Get the latest live and non-live search indexes.

        _Available in: v54.0_
      responses:
        '200':
          description: Collection of search indexes for a channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentSearchIndexCollection'
          x-summary: Managed Content Search Index Collection
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channel Search Indexes
    post:
      operationId: postManagedContentSearchIndexCollection
      summary: CMS Channel Search Indexes
      description: |
        Trigger incremental or full search indexing for a channel.

        _Available in: v54.0_

        After you index your content, use the [Experience Cloud CMS Content Search Resource](/docs/platform/connect-rest-api/references/connect-rest-api-cms#tag/Experience-Cloud-CMS-Content-Search-Resources/operation/getSiteSearch) to search your site.
      parameters:
      - name: fallbackToFullIndex
        in: query
        description: |
          Specifies whether to perform a full index in cases where incremental indexes aren’t possible ( `true` ) or not ( `false` ). If unspecified, defaults to `true` . This parameter has no effect if `isIncremental` is unspecified or set to `false` .

          _Available in: v59.0_
        required: false
        schema:
          type: boolean
      - name: isIncremental
        in: query
        description: |
          Specifies whether to update the index only with changes that have happened since the last full index was performed ( `true` ) or perform a full index ( `false` ). If unspecified, the default is `false` .

          _Available in: v59.0_
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Search index for a channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentSearchIndex'
          x-summary: Managed Content Search Index
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Channel Search Indexes
  /connect/cms/channels/{channelId}/searchable-content-types:
    description: Used to fetch all content types searchable status or update a content type searchable status in a channel.
    parameters:
    - name: channelId
      in: path
      description: ID of a channel.
      required: true
      schema:
        type: string
        format: Id
        pattern: ^(0ap)\w*
    get:
      operationId: getManagedContentTypeSearchableCollection
      summary: CMS Searchable Content Types, Channel
      description: |
        Get the searchable status for managed content types in a channel.

        _Available in: v49.0_
      parameters:
      - name: page
        in: query
        description: |
          Number of the page you want returned. Starts at 0. If you
          don’t specify a value or if you specify 0, the first page is returned.

          _Available in: v49.0_
        required: false
        schema:
          type: integer
      - name: pageSize
        in: query
        description: |
          Specifies the number of items
          per page. Valid values are from 1 through 250. If you don’t specify a value,
          the default size is 25.

          _Available in: v49.0_
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: |
            Collection of searchable statuses for managed content
            types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentTypeSearchableCollection'
          x-summary: Managed Content Type Searchable Collection
      tags:
      - CMS Managed Content Resources
      x-displayName: CMS Searchable Content Types, Channel
    patch:
      operationId: patchManagedContentTypeSearchableCollection
      summary: CMS Searchable Content Types, Channel
      description: |
        Update the searchable status for managed content types in a channel.

        _Available in: v49.0_
      requestBody:
        description: Update the searchable status of a managed content type.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentTypeSearchableInput'
            examples:
              example_1:
                value:
                  name: Media
                  isSearchable: 'false'
                summary: Payload 1
      responses:
        '200':
          description: Searchable status for a managed content type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentTypeSearchable'
          x-summary: Managed Content Type Searchable
      tags:
      - CMS Managed Content Resources
      x-displayName: CMS Searchable Content Types, Channel
  /connect/cms/contents:
    description: This API allows to create a new managed content.
    parameters: []
    post:
      operationId: postManagedContentDocumentCreate
      summary: CMS Contents
      description: |
        Create managed content.

        _Available in: v54.0_

        **Note:** In version 56.0 and later, you can upload binary files to create managed content. To
        upload a binary file, you must send it in a multipart/form-data request. For information
        about how to create the multipart/form-data message, see [Uploading Binary Files](/docs/platform/connect-rest-api/guide/intro_input#uploading-binary-files).
      parameters: []
      requestBody:
        description: Managed content.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentInput'
            examples:
              example_1:
                value:
                  contentSpaceOrFolderId: 0Zuxx00000003M5CAI
                  title: Title of Document
                  contentType: sfdc_cms__news
                  urlName: test-url
                  contentBody:
                    bannerImage:
                      source:
                        type: imageReference
                        ref:
                          contentKey: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    excerpt: this is test excerpt
                    body: '&lt;p&gt;Test body&lt;/p&gt;'
                summary: Payload 1
                description: Version 60.0 and later
              example_2:
                value:
                  contentSpaceOrFolderId: 0Zuxx00000003M5CAI
                  title: Title of Document
                  contentType: ftestSfdcOnly__banner
                  urlName: testUrl
                  contentBody:
                    bannerImage: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    featuredEvent: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    excerpt: this is test except
                    body: '&lt;p&gt;Test body&lt;/p&gt;'
                summary: Payload 2
                description: Version 54.0–59.0
          multipart/form-data:
            schema:
              type: object
              properties:
                ManagedContentInputParam:
                  $ref: '#/components/schemas/ManagedContentInput'
                contentData:
                  type: string
                  format: binary
      responses:
        '200':
          description: Managed content document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentDocument'
          x-summary: Managed Content Document
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents
  /connect/cms/contents/publish:
    description: Connect endpoint for CMS json based deployment publish action.
    parameters: []
    post:
      operationId: postManagedContentPublish
      summary: CMS Contents Publish
      description: |
        Publish content.

        _Available in: v55.0_
      parameters: []
      requestBody:
        description: Managed content publish.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentPublishInput'
            examples:
              example_1:
                value:
                  description: Test Description
                  contentIds:
                  - 20YRM0000000CPi2AM
                summary: Payload 1
      responses:
        '200':
          description: Managed content publish action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentPublishOutput'
          x-summary: Managed Content Publish
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Publish
  /connect/cms/contents/unpublish:
    description: Connect endpoint for CMS json based deployment unpublish action.
    parameters: []
    post:
      operationId: postManagedContentUnpublish
      summary: CMS Contents Unpublish
      description: |
        Unpublish content.

        _Available in: v55.0_
      parameters: []
      requestBody:
        description: Managed content unpublish.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentUnpublishInput'
            examples:
              example_1:
                value:
                  description: Test Description
                  contentIds:
                  - 20YRM0000000CPi2AM
                summary: Payload 1
      responses:
        '200':
          description: Managed content unpublish action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentUnpublishOutput'
          x-summary: Managed Content Unpublish
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Unpublish
  /connect/cms/contents/variants:
    description: This API allows create operation on a managed content variant.
    parameters: []
    post:
      operationId: postManagedContentVariantCreate
      summary: CMS Contents Variants
      description: |
        Create a managed content variant.

        _Available in: v58.0_
      parameters: []
      requestBody:
        description: Input used to create a managed content variant.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentVariantInput'
            examples:
              example_1:
                value:
                  managedContentKeyorId: MCWWQJDO2BUZAX7FITHQVAGIASAE
                  language: fr
                  title: French title
                  urlName: my_url_name
                  contentBody:
                    excerpt: French excerpt
                    body: French body
                summary: Payload 1
      responses:
        '200':
          description: Managed content variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentVariant'
          x-summary: Managed Content Variant
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Variants
  /connect/cms/contents/variants/{variantId}:
    description: This API allows operations on a managed content variant.
    parameters:
    - name: variantId
      in: path
      description: ID of the variant.
      required: true
      schema:
        type: string
        format: Id
        pattern: ^(9Ps)\w*
    get:
      operationId: getManagedContentVariant
      summary: CMS Contents Variant
      description: |
        Get a managed content variant.

        _Available in: v54.0_
      responses:
        '200':
          description: Managed content variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentVariant'
          x-summary: Managed Content Variant
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Variant
    put:
      operationId: putManagedContentVariant
      summary: CMS Contents Variant
      description: |
        Update a managed content variant.

        _Available in: v54.0_

        **Note:** In version 56.0 and later, you can upload binary files. To upload a binary file, you
        must send it in a multipart/form-data request. For information about how to create the
        multipart/form-data message, see [Uploading Binary Files](/docs/platform/connect-rest-api/guide/intro_input#uploading-binary-files).
      requestBody:
        description: Managed content variant update.
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                contentData:
                  type: string
                  format: binary
                apiName:
                  description: |
                    API name of the managed content variant.

                    _Available in: v63.0_
                  type: string
                contentBody:
                  description: |
                    Body of the managed content variant.

                    _Available in: v54.0_
                  type: string
                title:
                  description: |
                    Title of the managed content variant.

                    _Available in: v54.0_
                  type: string
                urlName:
                  description: |
                    URL name of the managed content variant within the org.

                    _Available in: v54.0_
                  type: string
            examples:
              example_1:
                value:
                  title: Title of Document
                  urlName: test-url
                  contentBody:
                    bannerImage:
                      source:
                        type: imageReference
                        ref:
                          contentKey: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    excerpt: this is test excerpt
                    body: '&lt;p&gt;Test body&lt;/p&gt;'
                summary: Payload 1
                description: Version 60.0 and later
              example_2:
                value:
                  title: My Updated Title
                  urlName: my_updated_url_name
                  contentBody:
                    bannerImage: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    featuredEvent: MCZOCY2AM5PFBADN5UDRB53TLXR4
                    excerpt: this is my updated excerpt
                    body: '&lt;p&gt;Test updated body&lt;/p&gt;'
                summary: Payload 2
                description: Version 54.0–59.0
      responses:
        '200':
          description: Managed content variant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentVariant'
          x-summary: Managed Content Variant
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Variant
    delete:
      operationId: deleteManagedContentVariant
      summary: CMS Contents Variant
      description: |
        Delete a managed content variant.

        _Available in: v54.0_
      responses:
        '200':
          description: "The response header contains an HTTP status code. If the response isn’t successful, the\n\t\tresponse body contains an error message, and if appropriate, information about the field or\n\t\tobject where the error occurred.\n"
          x-summary: Status Codes and Error Responses
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Contents Variant
  /connect/cms/contents/{contentKeyOrId}:
    description: This API allows to get existing managed content.
    parameters:
    - name: contentKeyOrId
      in: path
      description: A unique identifier or ID of a content.
      required: true
      schema:
        type: string
    get:
      operationId: getManagedContentDocument
      summary: CMS Content
      description: |
        Get a piece of managed content. In enhanced CMS workspaces, get a
        version of a piece of managed content.

        _Available in: v57.0_
      parameters:
      - name: contentVersion
        in: query
        description: |
          Content version of the managed content.

          _Available in: v66.0_
        required: false
        schema:
          type: string
      - name: language
        in: query
        description: |
          Language locale of the managed content, for example, `en_US`. If you don't specify `version` or if you specify a `version` corresponding to the latest version,
          the document is returned in the fallback language, if available, or in the
          primary language of the workspace. If you specify a `version` which isn’t the latest version and
          isn’t available for the language, an error is returned. If you don’t specify
          a language, the document is returned in the primary language of the
          workspace.

          _Available in: v57.0_
        required: false
        schema:
          type: string
      - name: variantVersion
        in: query
        description: |
          Variant version of the managed content.

          _Available in: v66.0_
        required: false
        schema:
          type: string
      - name: version
        in: query
        description: |
          In non-enhanced workspaces, the 18-character ID of the
          content version. In enhanced workspaces, the version number ID.

          _Available in: v57.0_
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Managed content document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentDocument'
          x-summary: Managed Content Document
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Content
  /connect/cms/contents/{contentKeyOrId}/clone:
    description: This API allows to clone existing managed content.
    parameters:
    - name: contentKeyOrId
      in: path
      description: Content key or ID of the managed content.
      required: true
      schema:
        type: string
    post:
      operationId: postManagedContentDocumentClone
      summary: CMS Content Clone
      description: |
        Clone a piece of managed content.

        _Available in: v61.0_
      requestBody:
        description: Managed content clone input.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentDocumentCloneInput'
            examples:
              example_1:
                value:
                  includeVariants: true
                  contentSpaceOrFolderId: 9Puxx0000004M92CAE
                  title: Cloned Content
                  apiName: new_api_name
                summary: Payload 1
      responses:
        '200':
          description: Managed content document clone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentDocumentClone'
          x-summary: Managed Content Document Clone
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Content Clone
  /connect/cms/contents/{contentKeyOrId}/taxonomy-terms:
    description: Resource for fetching and updating taxonomy terms associated with managed content.
    parameters:
    - name: contentKeyOrId
      in: path
      description: A unique identifier or ID of a content.
      required: true
      schema:
        type: string
    get:
      operationId: getManagedContentTaxonomyTerms
      summary: CMS Content Taxonomy Terms
      description: |
        Get taxonomy terms that are associated with managed content.

        Content admins use this resource to work with taxonomy term associations with CMS managed
        content. Content taxonomists use [Content Taxonomy Resources](/docs/platform/connect-rest-api/references/connect-rest-api-core#tag/Content-Taxonomy-Resources) to create, get, update, delete,
        and search content taxonomy terms.

        _Available in: v63.0_
      responses:
        '200':
          description: Collection of managed content taxonomy terms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentTaxonomyTermCollection'
          x-summary: Managed Content Taxonomy Term Collection
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Content Taxonomy Terms
    patch:
      operationId: patchManagedContentTaxonomyTerms
      summary: CMS Content Taxonomy Terms
      description: |
        Add or remove taxonomy term associations from managed content.

        Content admins use this resource to work with taxonomy term associations with CMS managed
        content. Content taxonomists use [Content Taxonomy Resources](/docs/platform/connect-rest-api/references/connect-rest-api-core#tag/Content-Taxonomy-Resources) to create, get, update, delete,
        and search content taxonomy terms.

        _Available in: v63.0_
      parameters:
      - name: publish
        in: query
        description: |
          Specifies whether to publish the taxonomy term associations ( `true` ) or not ( `false` ). If unspecified, defaults to `false` .

          If content is published and has no outstanding changes,
          setting `true` publishes the taxonomy
          term association changes. Setting `false` saves the taxonomy term association changes and those changes are published
          along with the next content publish.

          _Available in: v63.0_
        required: false
        schema:
          type: boolean
      requestBody:
        description: |
          Add or remove taxonomy term associations from managed content.

          _Available in: v63.0_
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManagedContentTaxonomyTermsInput'
            examples:
              example_1:
                value:
                  termsToAdd:
                  - 15dxx000001X8UzBBJ
                  - 15dxx000001X8UzBBJ
                  - 15dxx000001X8UzDBK
                  termsToRemove:
                  - 15dxx000001X8UzBCI
                summary: Payload 1
      responses:
        '200':
          description: Collection of managed content taxonomy terms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedContentTaxonomyTermCollection'
          x-summary: Managed Content Taxonomy Term Collection
      tags:
      - Enhanced CMS Workspaces Resources
      x-displayName: CMS Content Taxonomy Terms
  /connect/cms/delivery/channels:
    description: The delivery resource endpoint of Managed Content Channels API. Used to get channels available for the current user
    parameters: []
    get:
      operationId: getManagedContentDeliveryChannels
      summary: CMS Delivery Channels
      description: |
