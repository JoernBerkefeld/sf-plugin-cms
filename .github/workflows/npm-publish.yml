name: Publish NPM on Release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org/
      - run: npm ci --no-workspaces
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run validate:package
      - run: npm publish
