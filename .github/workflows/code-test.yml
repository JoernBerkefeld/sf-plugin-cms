name: Code Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    name: lint, build, and test with Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-workspaces
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run intake:check
      - run: npm run generate:check
      - run: npm run validate:package
      - run: npm pack --dry-run
